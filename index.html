<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><title>Talmid</title><meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--sf:#141414;--sf2:#1c1c1c;--ln:#2e2e2e;--tx:#ededed;--mu:#a8a8a8;--ac:#d4b57a;--ok:#4fae7a;--no:#e06b6b;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif","Times New Roman",serif}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;letter-spacing:.01em}
header{position:sticky;top:0;z-index:2;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:18px 20px;display:flex;align-items:center;gap:12px}
header h1{font-size:17px;font-weight:600;margin:0;flex:1;letter-spacing:.04em}.back{background:none;border:0;color:var(--ac);font-size:28px;line-height:1;padding:0 6px}
main{padding:20px;max-width:520px;margin:auto}
.btn{display:block;width:100%;padding:20px;margin:12px 0;border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--tx);font-size:17px;font-weight:600;text-align:left;transition:transform .15s,border-color .2s,background .2s;font-family:inherit}
.btn:active{transform:scale(.98)}.btn small{display:block;font-weight:400;color:var(--mu);font-size:14px;margin-top:6px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#15130e;text-align:center;letter-spacing:.03em}.btn.lock{opacity:.6}
.bar{height:3px;background:var(--ln);border-radius:2px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.card{background:linear-gradient(180deg,var(--sf2),var(--sf));border:1px solid var(--ln);border-radius:22px;min-height:300px;padding:28px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.35);font-size:20px;animation:flip .45s cubic-bezier(.2,.7,.2,1);transform-origin:center;backface-visibility:hidden}
@keyframes flip{from{transform:perspective(900px) rotateY(-80deg);opacity:0}to{transform:none;opacity:1}}
.big{font-size:34px;font-weight:700;letter-spacing:.01em}.gk{font-family:var(--serif);font-size:42px;margin:10px 0;color:var(--tx)}.pr{color:var(--mu);font-size:16px;letter-spacing:.04em}
.row{display:flex;gap:10px}.row .btn{text-align:center}
input,textarea{width:100%;font-size:22px;padding:16px;border-radius:16px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);text-align:center;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}textarea{font-family:var(--serif)!important;text-align:left}
.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#0b1a12!important}.no{background:var(--no)!important;border-color:var(--no)!important;color:#1d0b0b!important}
.cnt{text-align:center;color:var(--mu);margin:10px 0;font-size:14px;letter-spacing:.08em}.verse{font-family:var(--serif);font-size:22px;line-height:1.7;background:var(--sf);border:1px solid var(--ln);padding:22px;border-radius:20px;margin-top:12px}
.verse span{cursor:pointer}.hid{color:var(--ac);font-weight:600}
.vs{margin-top:18px;padding-top:14px;border-top:1px solid var(--ln);font-family:var(--serif);font-size:16px;line-height:1.6;color:#d0d0d0}.vs b{font-family:-apple-system,system-ui,sans-serif;font-size:13px;color:var(--mu);letter-spacing:.06em;display:block;margin-top:6px}
footer{font-size:10px;color:#8c8c8c;padding:28px 20px 36px;max-width:520px;margin:auto;line-height:1.5}
.big,.gk,.wl b{text-shadow:0 0 14px rgba(212,181,122,.45),0 0 2px rgba(212,181,122,.35);animation:glow 4s ease-in-out infinite}
.vs .gk{text-shadow:0 0 16px rgba(212,181,122,.55)}
@keyframes glow{0%,100%{text-shadow:0 0 10px rgba(212,181,122,.30),0 0 2px rgba(212,181,122,.25)}50%{text-shadow:0 0 20px rgba(212,181,122,.60),0 0 3px rgba(212,181,122,.4)}}
.card .big{animation:glow 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.card,.big,.gk,.wl b{animation:none!important}}
.stk{font-size:14px;font-weight:600;color:var(--ac);transition:all .3s}.stk.s3{text-shadow:0 0 8px rgba(212,181,122,.6)}.stk.s5{font-size:16px;text-shadow:0 0 12px rgba(212,181,122,.8)}.stk.s10{font-size:18px;text-shadow:0 0 18px rgba(255,190,90,.95)}
.burst{animation:burst .7s ease-out!important;box-shadow:0 0 0 0 rgba(212,181,122,.7)}
@keyframes burst{0%{box-shadow:0 0 0 0 rgba(212,181,122,.8);transform:scale(1)}40%{transform:scale(1.03)}100%{box-shadow:0 0 0 22px rgba(212,181,122,0);transform:scale(1)}}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--sf2);border:1px solid var(--ac);color:var(--tx);padding:12px 22px;border-radius:999px;font-size:15px;z-index:9;box-shadow:0 0 24px rgba(212,181,122,.35);animation:tin .3s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
.wl.m{border-color:rgba(212,181,122,.55);box-shadow:0 0 18px rgba(212,181,122,.18) inset}.wl.m b{color:#f3e2bd;text-shadow:0 0 16px rgba(212,181,122,.85),0 0 3px rgba(212,181,122,.6)}
.celeb{position:fixed;inset:0;background:#000 radial-gradient(circle at 50% 40%,rgba(212,181,122,.18),#000 65%);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;animation:tin .4s}
.celeb i{position:absolute;top:-10px;width:4px;height:4px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh);opacity:.2}}
.seal{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;color:#15130e;background:radial-gradient(circle at 35% 30%,#f1dcaa,#c9a35f 70%);box-shadow:0 0 40px rgba(212,181,122,.6)}
.mseal{color:var(--ac);text-shadow:0 0 10px rgba(212,181,122,.8);float:right}
.meter{height:10px;background:var(--ln);border-radius:5px;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9c7f45,var(--ac));box-shadow:0 0 14px var(--ac);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.days{text-align:center;color:var(--mu);font-size:14px;margin:4px 0 8px;letter-spacing:.06em}.days b{color:var(--ac);text-shadow:0 0 10px rgba(212,181,122,.6)}
@media (prefers-reduced-motion:reduce){.burst,.toast,.celeb,.celeb i{animation:none!important}.meter i{transition:none}}
input.soft{border-color:var(--ac);background:var(--sf2)}input.soft::placeholder{color:var(--ac);opacity:.9}input::placeholder{color:var(--mu)}footer a{color:var(--ac);text-decoration:none}</style></head><body>
<header><button class="back" id="back" hidden>‹</button><h1 id="ttl">Talmid</h1><span id="stk" class="stk"></span><button id="mute" class="back" style="font-size:18px" aria-label="Sound"></button></header>
<main id="app"></main>
<script src="data.js"></script><script src="license.js"></script><script src="app.js"></script></body></html>
